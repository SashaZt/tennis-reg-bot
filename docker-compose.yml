# Файл: docker-compose.yml
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  tennis_bot:
    build:
      context: ./client_tg
      dockerfile: Dockerfile
    container_name: client_tg
    # restart: unless-stopped
    environment:
      - TZ=${PROJECT__TIMEZONE}
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./client_tg:/app
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - app_network
    logging: *default-logging
    restart: no
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  app_network:
    driver: bridge
